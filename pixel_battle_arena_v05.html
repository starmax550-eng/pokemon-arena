<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17202e"><title>Pixel Battle Arena 6v6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121a27;color:#fff;font-family:system-ui,Arial,sans-serif}.app{max-width:520px;margin:auto;background:#1b2636;min-height:100vh}.top{height:48px;padding:6px 12px;background:linear-gradient(#2d3949,#131c2a);display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #728094}.logo{font-weight:1000;letter-spacing:1px;font-size:16px;text-shadow:2px 2px #000}.tiny{font-size:10px;color:#c2cede}.stage{position:relative;line-height:0;background:#9ba9ba}canvas#field{width:100%;height:auto;display:block;image-rendering:pixelated}.hud{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;background:linear-gradient(#101827ef,#10182700)}.box{display:grid;grid-template-columns:42px 1fr;gap:5px;align-items:center;background:#101a2be8;border:2px solid #c9d5e2;border-radius:7px;padding:3px;min-width:0;box-shadow:0 2px 5px #0008}.box.r{grid-template-columns:1fr 42px;text-align:right}.portrait{width:40px;height:40px;border:1px solid #ffe28a;background:#34465b;image-rendering:pixelated}.name{font-size:11px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px #000}.type{font-size:8px;font-weight:900;display:inline-block;padding:1px 4px;border-radius:4px;background:#596b85}.hp{height:9px;border:1px solid #e7edf3;border-radius:5px;background:#16202b;overflow:hidden;margin-top:3px}.hp i{display:block;height:100%;width:100%;background:linear-gradient(#a4ff8d,#27c95e);transition:width .2s}.balls{font-size:11px;letter-spacing:1px;color:#ffdf7c;margin-top:2px}.clock{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#111827;border:2px solid #697a90;border-radius:20px;padding:4px 13px;font-weight:1000;font-size:17px;line-height:1.1;box-shadow:0 3px 8px #0008}.fight{position:absolute;top:37%;left:0;right:0;text-align:center;font-size:clamp(48px,14vw,70px);font-weight:1000;font-style:italic;color:#ffdc35;-webkit-text-stroke:2px #251b1b;text-shadow:4px 5px #17141b;transform:rotate(-5deg);pointer-events:none;animation:pop .7s ease both}@keyframes pop{0%{opacity:0;scale:.2}70%{opacity:1;scale:1.12}100%{scale:1}}.controls{padding:10px;display:grid;gap:9px}.line{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d8e3ef}.moves{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:2px solid #7187a0;border-radius:8px;background:linear-gradient(#435a76,#263b55);color:#fff;font-weight:850;padding:10px 7px;box-shadow:0 3px #101827;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 1px #101827}button:disabled{opacity:.35}.move{text-align:left;min-height:50px}.move small{display:block;color:#c7d7e8;font-size:9px;font-weight:500}.move{position:relative;overflow:hidden}.move:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--move-color,#9bb4d0)}.battle-banner{font-size:10px;color:#f7df8b;text-align:center;min-height:14px}.switches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.switches button{font-size:10px;padding:8px 3px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.actions button{font-size:11px;padding:9px 2px}.log{height:72px;overflow:auto;background:#101a28;border:1px solid #455b75;border-radius:7px;padding:7px;font-size:11px;line-height:1.4;color:#dbe6f2}.good{color:#8df4a5}.bad{color:#ff9a9a}
</style></head><body><main class="app"><div class="top"><div><div class="logo">⚔ PIXEL BATTLE ARENA</div><div class="tiny">COMBAT 6v6 • VERSION 0.5</div></div><b class="tiny" id="state">PRÊT</b></div>
<div class="stage"><canvas id="field" width="420" height="760"></canvas><div class="hud"><div class="box"><canvas class="portrait" id="pa" width="40" height="40"></canvas><div><div class="name" id="na">PIKACHU</div><span class="type" id="ta">ÉLECTRIK</span><div class="hp"><i id="ha"></i></div><div class="balls" id="ba">● ● ● ● ● ●</div></div></div><div class="box r"><div><div class="name" id="nb">SPIRITOMB</div><span class="type" id="tb">SPECTRE</span><div class="hp"><i id="hb"></i></div><div class="balls" id="bb">● ● ● ● ● ●</div></div><canvas class="portrait" id="pb" width="40" height="40"></canvas></div></div><div class="clock" id="clock">00:00</div><div class="fight" id="fight">FIGHT!</div></div>
<div class="controls"><div class="line"><b id="hint">Choisis une attaque</b><span id="mode">MODE MANUEL</span></div><div class="moves" id="moves"></div><div class="battle-banner" id="banner">Attaques élémentaires améliorées</div><div class="actions"><button id="start">▶ Démarrer</button><button id="auto">AUTO</button><button id="pause">Ⅱ Pause</button><button id="reset">↻ Reset</button></div><b class="tiny">ÉQUIPE — toucher un Pokémon pour le sélectionner</b><div class="switches" id="switches"></div><div class="log" id="log">Bienvenue dans l'arène ! Démarre le combat.</div></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('field'),g=cv.getContext('2d');const D=[
['Pikachu','Électrik','#f3d447','#80551d',[['Éclair',22,'Électrik'],['Queue de Fer',19,'Acier'],['Vive-Attaque',15,'Normal'],['Tonnerre',30,'Électrik']]],['Spiritomb','Spectre / Ténèbres','#9864a8','#473254',[['Ball’Ombre',23,'Spectre'],['Onde Folie',15,'Spectre'],['Vibrobscur',22,'Ténèbres'],['Représailles',29,'Ténèbres']]],['Dracaufeu','Feu / Vol','#e77c39','#743d2c',[['Lance-Flammes',24,'Feu'],['Griffe',15,'Normal'],['Aile d’Acier',20,'Acier'],['Déflagration',31,'Feu']]],['Florizarre','Plante / Poison','#58a76d','#285d43',[['Fouet Lianes',20,'Plante'],['Bomb-Beurk',23,'Poison'],['Tranch’Herbe',17,'Plante'],['Lance-Soleil',30,'Plante']]],['Tortank','Eau','#609bcf','#31577e',[['Hydrocanon',28,'Eau'],['Morsure',16,'Ténèbres'],['Surf',23,'Eau'],['Laser Glace',25,'Glace']]],['Ectoplasma','Spectre / Poison','#9872b9','#503a73',[['Ball’Ombre',24,'Spectre'],['Onde Folie',15,'Spectre'],['Bomb-Beurk',22,'Poison'],['Dévorêve',28,'Psy']]],['Ronflex','Normal','#9ba9c5','#58637c',[['Plaquage',22,'Normal'],['Séisme',24,'Sol'],['Repos',0,'Soin'],['Mégaphone',27,'Normal']]],['Dracolosse','Dragon / Vol','#e4a05d','#93603a',[['Draco-Griffe',23,'Dragon'],['Aéropique',19,'Vol'],['Poing Feu',21,'Feu'],['Colère',31,'Dragon']]],['Mewtwo','Psy','#b9a5d8','#67558a',[['Psyko',25,'Psy'],['Ball’Ombre',21,'Spectre'],['Exploforce',24,'Combat'],['Frappe Atlas',29,'Combat']]],['Lucario','Combat / Acier','#5999b6','#31566f',[['Aurasphère',24,'Combat'],['Métalaser',26,'Acier'],['Vive-Attaque',17,'Normal'],['Close Combat',30,'Combat']]],['Arcanin','Feu','#df914a','#8b5031',[['Lance-Flammes',24,'Feu'],['Vitesse Extrême',21,'Normal'],['Mâchouille',19,'Ténèbres'],['Boutefeu',29,'Feu']]],['Nymphali','Fée','#e7a9c5','#9b668a',[['Mégaphone',20,'Normal'],['Pouvoir Lunaire',25,'Fée'],['Vive-Attaque',15,'Normal'],['Dernier Recours',28,'Normal']]]];
const mk=d=>({n:d[0],type:d[1],color:d[2],dark:d[3],moves:d[4],hp:100,alive:true,flash:0});let T=[],A=[0,0],run=false,auto=false,sec=0,winner=-1,timer=null,particles=[],projectiles=[],motion=[0,0],bannerTicks=0;function setup(){let p=[...D].sort(()=>Math.random()-.5);T=[p.slice(0,6).map(mk),p.slice(6).map(mk)];T[0][0]=mk(D[0]);T[1][0]=mk(D[1]);A=[0,0]}function cur(s){return T[s][A[s]]}function alive(s){return T[s].filter(m=>m.alive)}function log(t,cl=''){let e=document.createElement('div');e.className=cl;e.textContent=t;$('log').prepend(e);while($('log').children.length>20)$('log').lastChild.remove()}
function sprite(ctx,m,x,y,sc=1){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);let p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)},poly=(a,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...a[0]);a.slice(1).forEach(v=>ctx.lineTo(...v));ctx.closePath();ctx.fill()},C=m.color,K='#202637',dk=m.dark;ctx.fillStyle='#15202b55';ctx.beginPath();ctx.ellipse(0,21,29,7,0,0,7);ctx.fill();if(m.n==='Pikachu'){poly([[-13,-8],[-19,-20],[-11,-17],[-6,-8],[7,-8],[13,-20],[20,-25],[16,-5],[18,9],[10,17],[-10,17],[-17,8]],C);p(-19,-30,6,18,C);p(-18,-31,3,8,'#2a2025');p(12,-31,6,18,C);p(14,-32,3,8,'#2a2025');poly([[14,7],[25,0],[22,11],[33,14],[23,19],[13,16]],C);p(-14,-1,5,5,'#e85e57');p(9,-1,5,5,'#e85e57');p(-8,-8,3,5,K);p(8,-8,3,5,K);p(-4,8,9,2,dk)}else if(m.n==='Spiritomb'){poly([[-19,-12],[-13,-23],[2,-25],[17,-17],[22,-3],[16,13],[2,20],[-17,12]],'#765386');p(-14,-16,28,27,'#49375f');for(let i=0;i<12;i++)p(-13+(i%4)*8,-16+Math.floor(i/4)*10,4,4,['#9be65d','#e9a2d7','#a4e9ee'][i%3]);p(-8,-5,5,4,'#d9f5a3');p(6,-5,5,4,'#d9f5a3');p(-3,8,8,3,'#211b34');poly([[-14,-20],[-22,-31],[-8,-25]],'#a16fb0');poly([[12,-19],[23,-29],[18,-14]],'#a16fb0')}else if(m.n==='Dracaufeu'){poly([[-14,-8],[-19,-20],[-7,-15],[0,-24],[11,-16],[18,-5],[13,15],[-12,15]],C);poly([[-11,-5],[-36,-27],[-29,-5],[-13,5]],'#e9c56b');poly([[11,-5],[36,-27],[29,-5],[13,5]],'#e9c56b');p(-12,-29,8,12,C);p(6,-29,8,12,C);p(-7,-7,4,5,K);p(7,-7,4,5,K);poly([[13,12],[27,16],[33,23],[21,22]],C);p(25,21,8,4,'#ffc04b')}else{poly([[-16,-8],[-19,-21],[-8,-18],[0,-26],[12,-18],[19,-4],[13,15],[-13,15]],C);p(-14,-28,8,12,C);p(7,-28,8,12,C);p(-9,-8,4,5,K);p(7,-8,4,5,K);p(-4,7,9,3,dk);poly([[-14,-7],[-30,-20],[-24,0],[-12,5]],dk);poly([[14,-7],[30,-20],[24,0],[12,5]],dk)}if(m.flash){ctx.globalAlpha=.8;p(-28,-38,56,68,'#fff');ctx.globalAlpha=1}ctx.restore()}
function arena(){let im=g.createImageData(420,760),d=im.data;for(let y=0;y<760;y++)for(let x=0;x<420;x++){let i=(y*420+x)*4,n=Math.sin(x*.05+y*.03)*9+Math.sin(x*.017-y*.044)*7+Math.random()*8,v=164+n;d[i]=v-12;d[i+1]=v-5;d[i+2]=v+5;d[i+3]=255}g.putImageData(im,0,0);for(let i=0;i<380;i++){let x=Math.random()*420,y=112+Math.random()*640;g.fillStyle=i%2?'#e8edf520':'#34465b18';g.fillRect(x,y,2+Math.random()*17,2+Math.random()*10)}g.strokeStyle='#edf5ff99';g.lineWidth=2;g.strokeRect(12,115,396,625);g.beginPath();g.arc(210,425,74,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(12,425);g.lineTo(408,425);g.stroke();for(let i=0;i<50;i++){let x=i*79%420,y=115+i*137%640;g.fillStyle='#fff9';g.fillRect(x,y,1,2)}}
function draw(){arena();sprite(g,cur(1),210+motion[1],246,1.35);sprite(g,cur(0),210+motion[0],560,1.18);g.fillStyle='#9a302e';g.fillRect(191,662,38,28);g.fillStyle='#df4837';g.fillRect(187,646,46,22);g.fillStyle='#e8b991';g.fillRect(195,652,30,15);g.fillStyle='#28364b';g.fillRect(194,671,32,22);g.fillStyle='#e8b63c';g.fillRect(197,690,10,14);g.fillRect(214,690,10,14);particles.forEach(f=>{g.globalAlpha=Math.max(0,f.life/22);g.fillStyle=f.col;g.fillRect(f.x,f.y,f.sz,f.sz);g.globalAlpha=1});projectiles.forEach(f=>{g.globalAlpha=Math.max(.15,f.life/24);g.fillStyle=f.col;if(f.kind==='Eau'){g.beginPath();g.ellipse(f.x,f.y,6,11,0,0,Math.PI*2);g.fill()}else if(f.kind==='Feu'){g.beginPath();g.arc(f.x,f.y,8,0,Math.PI*2);g.fill();g.fillStyle='#ffe58a';g.fillRect(f.x-2,f.y-6,4,10)}else if(f.kind==='Électrik'){g.fillRect(f.x-2,f.y-10,5,20);g.fillRect(f.x-7,f.y-2,14,4)}else{g.beginPath();g.arc(f.x,f.y,8,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.fillRect(f.x-2,f.y-2,4,4)}g.globalAlpha=1})}function portrait(id,m){let el=$(id),q=el.getContext('2d');q.clearRect(0,0,40,40);sprite(q,m,20,22,.58)}function hud(){let a=cur(0),b=cur(1);$('na').textContent=a.n.toUpperCase();$('nb').textContent=b.n.toUpperCase();$('ta').textContent=a.type.toUpperCase();$('tb').textContent=b.type.toUpperCase();$('ha').style.width=a.hp+'%';$('hb').style.width=b.hp+'%';$('ba').textContent=T[0].map(m=>m.alive?'●':'○').join(' ');$('bb').textContent=T[1].map(m=>m.alive?'●':'○').join(' ');portrait('pa',a);portrait('pb',b);$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('state').textContent=winner>=0?(winner?'DÉFAITE':'VICTOIRE'):run?'EN COMBAT':'EN PAUSE'}function controls(){let m=cur(0);$('moves').innerHTML='';m.moves.forEach((v,i)=>{let b=document.createElement('button');b.className='move';b.style.setProperty('--move-color',elemColor(v[2]));b.disabled=!run||auto||winner>=0;b.innerHTML=v[0]+'<small>'+v[2]+' • '+(v[1]||'Soin')+'</small>';b.onclick=()=>attack(0,i);$('moves').append(b)});$('switches').innerHTML='';T[0].forEach((p,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+p.n;b.disabled=!run||!p.alive||i===A[0];b.onclick=()=>{A[0]=i;log('Tu envoies '+p.n+' !');refresh()};$('switches').append(b)});$('mode').textContent=auto?'MODE AUTO':'MODE MANUEL'}function refresh(){hud();draw();controls()}function elemColor(t){return ({'Feu':'#ff8738','Électrik':'#ffe45d','Eau':'#73dcff','Plante':'#82e17b','Spectre':'#a88be8','Psy':'#f2a2f0','Glace':'#b9f6ff','Dragon':'#9e82ef','Poison':'#bd72cf','Combat':'#e58c55','Acier':'#c5d2e2','Fée':'#f2a8d0','Sol':'#d8b36d','Vol':'#b6c8ed','Ténèbres':'#8b83a9'})[t]||'#f1f5ff'}function effectiveness(at,def){let strong={'Feu':['Plante','Glace'],'Eau':['Feu','Sol'],'Électrik':['Eau','Vol'],'Plante':['Eau','Sol'],'Glace':['Dragon','Vol'],'Spectre':['Psy'],'Ténèbres':['Psy','Spectre'],'Psy':['Combat','Poison'],'Combat':['Normal','Acier'],'Sol':['Électrik','Feu'],'Poison':['Fée','Plante'],'Fée':['Dragon','Ténèbres'],'Dragon':['Dragon'],'Acier':['Glace','Fée']};let weak={'Feu':['Eau'],'Eau':['Plante','Électrik'],'Électrik':['Sol'],'Plante':['Feu','Glace','Poison','Vol'],'Spectre':['Ténèbres'],'Psy':['Ténèbres'],'Combat':['Psy','Vol'],'Sol':['Plante','Eau','Glace'],'Glace':['Feu','Acier'],'Dragon':['Glace'],'Poison':['Psy','Sol'],'Fée':['Poison','Acier'],'Acier':['Feu']};let n=1;def.split(' / ').forEach(t=>{if((strong[at]||[]).includes(t))n*=1.5;if((weak[at]||[]).includes(t))n*=.7});return n}function enemySwitch(){let i=T[1].findIndex(p=>p.alive);if(i>=0){A[1]=i;log('L’adversaire envoie '+cur(1).n+' !')}}function attack(s,i){if(winner>=0)return;let a=cur(s),b=cur(1-s),mv=a.moves[i];if(mv[1]===0){let h=Math.min(25,100-a.hp);a.hp+=h;log(a.n+' récupère '+h+' PV.','good')}else{let mult=effectiveness(mv[2],b.type),crit=Math.random()<.1,dmg=Math.max(5,Math.round((mv[1]+Math.floor(Math.random()*9)-4)*mult*(crit?1.5:1)));b.hp=Math.max(0,b.hp-dmg);b.flash=7;let col=elemColor(mv[2]);motion[s]=s===0?25:-25;setTimeout(()=>{motion[s]=0;draw()},170);projectiles.push({x:210,y:s?260:545,vy:s?8:-8,life:24,col,kind:mv[2]});for(let k=0;k<25;k++)particles.push({x:210+(Math.random()-.5)*30,y:s?246:560,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:24,col,sz:2+Math.random()*6});let extra=mult>=1.5?' Super efficace !':mult<1?' Peu efficace…':'';if(crit)extra+=' Coup critique !';$('banner').textContent=mv[0]+' • '+(mult>=1.5?'SUPER EFFICACE':mult<1?'PEU EFFICACE':'IMPACT')+(crit?' • CRITIQUE':'');bannerTicks=70;log(a.n+' utilise '+mv[0]+' ! −'+dmg+' PV.'+extra,s?'bad':'good')}if(b.hp<=0){b.alive=false;log(b.n+' est K.O. !','bad');if(alive(1-s).length){if(s===1)enemySwitch();else{A[1-s]=T[1-s].findIndex(p=>p.alive);log('Tu envoies '+cur(1-s).n+' !')}}else{winner=s;run=false;clearInterval(timer);log(s===0?'🏆 Tu remportes le combat !':'Défaite : l’adversaire gagne.')}}refresh()}function enemy(){let m=cur(1),i=Math.floor(Math.random()*4);if(m.hp<18&&alive(1).length>1){A[1]=T[1].findIndex(p=>p.alive&&p!==m);log('L’adversaire change de Pokémon : '+cur(1).n);return}attack(1,i)}function start(){if(winner>=0)return;run=true;$('fight').style.display='none';$('hint').textContent='Combat en cours';log('FIGHT ! Le combat commence.');clearInterval(timer);timer=setInterval(()=>{if(!run)return;sec++;if(auto)attack(0,Math.floor(Math.random()*4));if(winner<0)enemy();hud()},auto?1250:1850);refresh()}function pause(){run=false;clearInterval(timer);$('hint').textContent='Combat en pause';refresh()}function reset(){pause();setup();sec=0;winner=-1;particles=[];projectiles=[];motion=[0,0];$('fight').style.display='block';$('hint').textContent='Choisis une attaque';$('log').textContent='Nouvelle partie ! Prêt au combat.';refresh()}$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=reset;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'AUTO ✓':'AUTO';if(run){pause();start()}controls()};setup();refresh();setInterval(()=>{particles.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.life--});particles=particles.filter(f=>f.life>0);projectiles.forEach(f=>{f.y+=f.vy;f.life--});projectiles=projectiles.filter(f=>f.life>0);if(bannerTicks>0)bannerTicks--;else $('banner').textContent='Choisis une attaque pour déclencher un effet élémentaire';if(run){T.flat().forEach(m=>{if(m.flash)m.flash--});draw()}},40)})();
</script></body></html>
